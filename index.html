<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b1d">
<title>TopX AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% 20%, rgba(85,70,255,.25), transparent 35%),
    radial-gradient(circle at 20% 80%, rgba(0,180,255,.12), transparent 30%),
    #050714;
  color: white;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .25;
  background-image:
    linear-gradient(rgba(90,100,255,.12) 1px, transparent 1px),
    linear-gradient(90deg, rgba(90,100,255,.12) 1px, transparent 1px);
  background-size: 45px 45px;
  mask-image: linear-gradient(to bottom, black, transparent);
}

header {
  height: 90px;
  padding: 0 25px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(130,140,255,.2);
  background: rgba(5,7,20,.75);
  backdrop-filter: blur(15px);
  position: relative;
  z-index: 2;
}

.logo {
  font-size: 36px;
  font-weight: 800;
}

.logo span {
  color: #704cff;
  text-shadow: 0 0 20px #704cff;
}

.online {
  color: #9ba6ca;
  font-size: 18px;
}

.dot {
  display: inline-block;
  width: 12px;
  height: 12px;
  margin-right: 8px;
  border-radius: 50%;
  background: #55ff9a;
  box-shadow: 0 0 18px #55ff9a;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 35px 20px 150px;
  position: relative;
  z-index: 1;
}

.robot {
  width: 170px;
  height: 170px;
  margin: 15px auto 30px;
  border-radius: 50%;
  border: 2px solid rgba(105,90,255,.5);
  box-shadow:
    0 0 30px rgba(100,70,255,.4),
    inset 0 0 35px rgba(80,60,255,.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 70px;
  animation: pulse 3s infinite ease-in-out;
}

@keyframes pulse {
  50% {
    transform: scale(1.04);
    box-shadow:
      0 0 55px rgba(100,70,255,.7),
      inset 0 0 45px rgba(80,60,255,.5);
  }
}

.message {
  padding: 22px;
  margin: 18px 0;
  border-radius: 24px;
  font-size: 20px;
  line-height: 1.5;
  border: 1px solid rgba(110,120,255,.25);
  background: rgba(20,24,48,.82);
  box-shadow: 0 10px 35px rgba(0,0,0,.2);
}

.user {
  margin-left: 15%;
  background: linear-gradient(135deg, #354cff, #7735ff);
}

.ai {
  margin-right: 15%;
}

#status {
  text-align: center;
  color: #9ba6ca;
  margin: 20px 0;
}

.controls {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 30px);
  max-width: 850px;
  padding: 12px;
  display: flex;
  gap: 10px;
  border-radius: 30px;
  background: rgba(15,18,40,.92);
  border: 1px solid rgba(110,120,255,.35);
  box-shadow: 0 0 40px rgba(50,40,255,.2);
  backdrop-filter: blur(18px);
}

input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  border-radius: 22px;
  padding: 18px;
  background: transparent;
  color: white;
  font-size: 18px;
}

input::placeholder {
  color: #7f89ad;
}

button {
  width: 65px;
  height: 65px;
  border: 0;
  border-radius: 50%;
  color: white;
  font-size: 25px;
  cursor: pointer;
  background: linear-gradient(135deg, #485cff, #7b25ff);
  box-shadow: 0 0 25px rgba(90,60,255,.35);
}

button:active {
  transform: scale(.94);
}

#mic.listening {
  background: #ff315c;
  box-shadow: 0 0 30px rgba(255,49,92,.7);
}

.hint {
  position: fixed;
  bottom: 2px;
  left: 0;
  right: 0;
  text-align: center;
  color: #7f89ad;
  font-size: 13px;
  pointer-events: none;
}

@media (max-width: 600px) {
  header {
    height: 75px;
  }

  .logo {
    font-size: 30px;
  }

  .robot {
    width: 135px;
    height: 135px;
    font-size: 55px;
  }

  .message {
    font-size: 18px;
  }

  .user {
    margin-left: 5%;
  }

  .ai {
    margin-right: 5%;
  }
}
</style>

</head>

<body>

<header>
  <div class="logo">Top<span>X</span> AI</div>
  <div class="online">
    <span class="dot"></span>ONLINE
  </div>
</header>

<main>
  <div class="robot">🤖</div>

  <div id="status">Ready</div>

  <div id="chat">
    <div class="message ai">
      Hey, I'm TopX. I'm ready to listen.
    </div>
  </div>
</main>

<div class="controls">
  <input id="input" type="text" placeholder="Talk to TopX..." autocomplete="off">

<button id="mic" type="button">🎙️</button> <button id="send" type="button">➤</button>

</div>

<div class="hint">Tap the microphone to talk</div>

<script>
const input = document.getElementById("input");
const send = document.getElementById("send");
const mic = document.getElementById("mic");
const chat = document.getElementById("chat");
const status = document.getElementById("status");

const MY_INSTAGRAM =
  "https://www.instagram.com/warfere_98/";

let recognition = null;
let listening = false;


// ============================
// CHAT DISPLAY
// ============================

function addMessage(text, type) {
  const message = document.createElement("div");

  message.className = "message " + type;
  message.textContent = text;

  chat.appendChild(message);

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}


// ============================
// SPEAKING
// ============================

function speak(text) {
  if (!("speechSynthesis" in window)) {
    return;
  }

  window.speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance(text);

  voice.rate = 1;
  voice.pitch = 1;
  voice.volume = 1;

  window.speechSynthesis.speak(voice);
}


// ============================
// INSTAGRAM
// ============================

function openInstagram() {
  window.open(MY_INSTAGRAM, "_blank");
}


// ============================
// YOUTUBE
// ============================

function openYouTube(song) {
  const query = encodeURIComponent(song || "music");

  window.open(
    "https://www.youtube.com/results?search_query=" + query,
    "_blank"
  );
}


// ============================
// TIKTOK
// ============================

function openTikTok(song) {
  const query = encodeURIComponent(song || "music");

  window.open(
    "https://www.tiktok.com/search?q=" + query,
    "_blank"
  );
}


// ============================
// SPECIAL COMMANDS
// ============================

function handleCommand(message) {

  const command = message.toLowerCase().trim();

  // Instagram
  if (
    command.includes("open my instagram") ||
    command.includes("go to my instagram") ||
    command.includes("take me to instagram") ||
    command === "instagram"
  ) {
    const reply = "Opening your Instagram.";

    addMessage(reply, "ai");
    speak(reply);
    openInstagram();

    return true;
  }


  // YouTube
  if (
    command.includes("youtube") &&
    (
      command.includes("play") ||
      command.includes("find") ||
      command.includes("search")
    )
  ) {

    let song = message
      .replace(/youtube/ig, "")
      .replace(/play/ig, "")
      .replace(/find/ig, "")
      .replace(/search/ig, "")
      .replace(/on/ig, "")
      .trim();

    if (!song) {
      song = "music";
    }

    const reply = "Opening YouTube for " + song + ".";

    addMessage(reply, "ai");
    speak(reply);
    openYouTube(song);

    return true;
  }


  // TikTok
  if (
    command.includes("tiktok") &&
    (
      command.includes("play") ||
      command.includes("find") ||
      command.includes("search")
    )
  ) {

    let song = message
      .replace(/tiktok/ig, "")
      .replace(/play/ig, "")
      .replace(/find/ig, "")
      .replace(/search/ig, "")
      .replace(/on/ig, "")
      .trim();

    if (!song) {
      song = "music";
    }

    const reply = "Opening TikTok for " + song + ".";

    addMessage(reply, "ai");
    speak(reply);
    openTikTok(song);

    return true;
  }

  return false;
}


// ============================
// TALK TO YOUR SERVER / AI
// ============================

async function askTopX(message) {

  if (!message || !message.trim()) {
    return;
  }

  addMessage(message, "user");

  input.value = "";

  // Handle commands such as Instagram,
  // YouTube and TikTok locally.
  if (handleCommand(message)) {
    return;
  }

  status.textContent = "Thinking...";

  try {

    const response = await fetch("/api/chat", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: message
      })
    });

    if (!response.ok) {
      throw new Error("Server returned " + response.status);
    }

    const data = await response.json();

    const answer =
      data.reply ||
      data.response ||
      data.text ||
      "I couldn't get an answer.";

    addMessage(answer, "ai");

    status.textContent = "Ready";

    // Automatically speak AI answer
    speak(answer);

  } catch (error) {

    console.error(error);

    const reply =
      "I couldn't connect to my AI server right now.";

    addMessage(reply, "ai");

    status.textContent = "Connection problem";

    speak(reply);
  }
}


// ============================
// SEND BUTTON
// ============================

send.addEventListener("click", () => {

  const message = input.value.trim();

  if (message) {
    askTopX(message);
  }
});


// ============================
// ENTER KEY
// ============================

input.addEventListener("keydown", (event) => {

  if (event.key === "Enter") {

    event.preventDefault();

    const message = input.value.trim();

    if (message) {
      askTopX(message);
    }
  }
});


// ============================
// VOICE RECOGNITION
// ============================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {

    listening = true;

    mic.classList.add("listening");

    status.textContent = "Listening...";
  };


  recognition.onresult = (event) => {

    const transcript =
      event.results[0][0].transcript;

    input.value = transcript;

    askTopX(transcript);
  };


  recognition.onerror = (event) => {

    console.error("Speech error:", event.error);

    listening = false;

    mic.classList.remove("listening");

    status.textContent = "Ready";
  };


  recognition.onend = () => {

    listening = false;

    mic.classList.remove("listening");

    if (status.textContent === "Listening...") {
      status.textContent = "Ready";
    }
  };


  mic.addEventListener("click", () => {

    if (listening) {

      recognition.stop();

    } else {

      try {
        recognition.start();
      } catch (error) {
        console.error(error);
      }
    }
  });

} else {

  mic.addEventListener("click", () => {

    addMessage(
      "Voice recognition isn't supported by this browser.",
      "ai"
    );

    speak(
      "Voice recognition isn't supported by this browser."
    );
  });
}


// ============================
// STARTUP
// ============================

window.addEventListener("load", () => {

  setTimeout(() => {

    speak(
      "Hey, I'm TopX. I'm ready to listen."
    );

  }, 800);

});
</script>

</body>
</html>
