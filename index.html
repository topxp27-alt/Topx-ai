<body>

<div class="app">

  <header>
    <div class="logo">Top<span>X</span> AI</div>

    <div class="status">
      <div class="dot"></div>
      <span id="status">ONLINE</span>
    </div>
  </header>

  <main id="chat">
    <div class="message ai">
      Hey, I'm TopX. I'm ready to listen.
    </div>
  </main>

  <div class="bottom">
    <div class="controls">

      <input
        id="text"
        type="text"
        placeholder="Talk to TopX..."
        autocomplete="off"
      >

      <button id="mic" title="Talk">🎙️</button>

      <button id="send" title="Send">➤</button>

    </div>

    <div class="hint" id="hint">
      Tap the microphone to talk
    </div>
  </div>

</div>

<script>
  const chat = document.getElementById("chat");
  const text = document.getElementById("text");
  const mic = document.getElementById("mic");
  const send = document.getElementById("send");
  const status = document.getElementById("status");
  const hint = document.getElementById("hint");

  let recognition;
  let listening = false;

  function addMessage(message, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = message;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function speak(message) {
    if (!("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const voice = new SpeechSynthesisUtterance(message);
    voice.rate = 1;
    voice.pitch = 1;
    voice.volume = 1;

    window.speechSynthesis.speak(voice);
  }

  async function askTopX(message) {
    if (!message.trim()) return;

    addMessage(message, "user");

    status.textContent = "THINKING...";
    hint.textContent = "TopX is thinking...";

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: message
        })
      });

      if (!response.ok) {
        throw new Error("Server error");
      }

      const data = await response.json();

      const answer =
        data.reply ||
        data.response ||
        data.text ||
        "Sorry, I couldn't answer that.";

      addMessage(answer, "ai");

      status.textContent = "ONLINE";
      hint.textContent = "Tap the microphone to talk";

      speak(answer);

    } catch (error) {
      console.error(error);

      addMessage(
        "Sorry, something went wrong connecting to TopX.",
        "ai"
      );

      status.textContent = "ONLINE";
      hint.textContent = "Tap the microphone to talk";
    }
  }

  send.addEventListener("click", () => {
    const message = text.value.trim();

    if (!message) return;

    text.value = "";
    askTopX(message);
  });

  text.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      send.click();
    }
  });

  if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
      listening = true;
      mic.classList.add("listening");
      status.textContent = "LISTENING";
      hint.textContent = "I'm listening...";
    };

    recognition.onresult = (event) => {
      const transcript =
        event.results[0][0].transcript;

      text.value = transcript;

      listening = false;
      mic.classList.remove("listening");

      askTopX(transcript);
    };

    recognition.onerror = (event) => {
      console.log("Speech recognition error:", event.error);

      listening = false;
      mic.classList.remove("listening");

      status.textContent = "ONLINE";
      hint.textContent = "Tap the microphone to talk";
    };

    recognition.onend = () => {
      listening = false;
      mic.classList.remove("listening");

      if (status.textContent === "LISTENING") {
        status.textContent = "ONLINE";
        hint.textContent = "Tap the microphone to talk";
      }
    };

  } else {
    hint.textContent =
      "Voice recognition isn't supported by this browser";
  }

  mic.addEventListener("click", () => {

    if (!recognition) {
      alert(
        "Voice recognition is not supported in this browser. Try Chrome or Safari."
      );
      return;
    }

    if (listening) {
      recognition.stop();
      return;
    }

    try {
      recognition.start();
    } catch (error) {
      console.log(error);
    }
  });

</script>

</body>
</html>
