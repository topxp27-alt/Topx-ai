<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050817">
<title>TopX AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#030510;
  color:white;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

/* FUTURISTIC BACKGROUND */
.background{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 35%,#18245d 0%,#090d2b 35%,#030510 75%);
  z-index:-5;
}

.grid{
  position:absolute;
  inset:-50%;
  background-image:
    linear-gradient(rgba(75,110,255,.12) 1px,transparent 1px),
    linear-gradient(90deg,rgba(75,110,255,.12) 1px,transparent 1px);
  background-size:45px 45px;
  transform:perspective(500px) rotateX(65deg);
  animation:gridMove 12s linear infinite;
}

@keyframes gridMove{
  from{transform:perspective(500px) rotateX(65deg) translateY(0)}
  to{transform:perspective(500px) rotateX(65deg) translateY(45px)}
}

/* glowing AI core */
.core{
  position:absolute;
  width:260px;
  height:260px;
  border-radius:50%;
  left:50%;
  top:28%;
  transform:translate(-50%,-50%);
  background:radial-gradient(
    circle at 35% 30%,
    #ffffff 0%,
    #79a0ff 8%,
    #673cff 30%,
    #35128d 58%,
    #07091e 75%
  );
  box-shadow:
    0 0 35px #5537ff,
    0 0 90px #4225ff,
    0 0 180px rgba(69,45,255,.55);
  animation:pulse 3s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.06)}
}

.ring{
  position:absolute;
  left:50%;
  top:28%;
  border:1px solid rgba(91,116,255,.45);
  border-radius:50%;
  transform:translate(-50%,-50%);
}

.r1{width:330px;height:330px}
.r2{width:430px;height:430px}
.r3{
  width:540px;
  height:540px;
  border-color:rgba(124,65,255,.25);
}

.scan{
  position:absolute;
  width:100%;
  height:2px;
  background:linear-gradient(
    90deg,
    transparent,
    #526dff,
    transparent
  );
  top:28%;
  animation:scan 4s linear infinite;
  opacity:.7;
}

@keyframes scan{
  0%{transform:translateY(-180px)}
  100%{transform:translateY(180px)}
}

/* small HUD dots */
.dot{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#6f83ff;
  box-shadow:0 0 12px #6377ff;
  animation:blink 2s infinite alternate;
}

@keyframes blink{
  from{opacity:.2}
  to{opacity:1}
}

.d1{top:18%;left:15%}
.d2{top:34%;left:82%}
.d3{top:70%;left:12%}
.d4{top:78%;left:87%}
.d5{top:55%;left:8%}
.d6{top:25%;left:92%}

/* MAIN APP */
.app{
  width:100%;
  max-width:760px;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
}

header{
  height:80px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  border-bottom:1px solid rgba(120,140,255,.15);
  background:rgba(3,5,16,.72);
  backdrop-filter:blur(15px);
}

.logo{
  font-size:30px;
  font-weight:800;
  letter-spacing:-1px;
}

.logo span{
  color:#725cff;
  text-shadow:0 0 15px #654cff;
}

.status{
  font-size:13px;
  color:#8793b8;
  display:flex;
  align-items:center;
  gap:8px;
}

.statusDot{
  width:8px;
  height:8px;
  background:#43ff9a;
  border-radius:50%;
  box-shadow:0 0 10px #43ff9a;
}

/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:25px 20px 150px;
  scroll-behavior:smooth;
}

.message{
  max-width:85%;
  padding:16px 18px;
  margin-bottom:15px;
  border-radius:20px;
  line-height:1.5;
  font-size:16px;
  animation:appear .25s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.ai{
  background:rgba(20,25,48,.88);
  border:1px solid rgba(106,124,255,.15);
  box-shadow:0 8px 30px rgba(0,0,0,.2);
}

.user{
  margin-left:auto;
  background:linear-gradient(135deg,#465cff,#762cff);
  box-shadow:0 8px 25px rgba(73,63,255,.25);
}

/* BOTTOM */
.controls{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:18px;
  background:linear-gradient(
    transparent,
    rgba(3,5,16,.96) 30%
  );
}

.inputArea{
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(15,19,39,.94);
  border:1px solid rgba(100,120,255,.25);
  border-radius:25px;
  padding:8px;
  backdrop-filter:blur(15px);
}

input{
  flex:1;
  border:none;
  outline:none;
  background:transparent;
  color:white;
  font-size:16px;
  padding:12px;
}

input::placeholder{
  color:#747c9c;
}

button{
  border:none;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.mic{
  width:55px;
  height:55px;
  border-radius:50%;
  background:linear-gradient(135deg,#465cff,#762cff);
  font-size:23px;
  box-shadow:0 0 20px rgba(91,65,255,.4);
}

.mic.listening{
  background:#ff315d;
  box-shadow:
    0 0 20px #ff315d,
    0 0 45px rgba(255,49,93,.5);
  animation:micPulse 1s infinite;
}

@keyframes micPulse{
  50%{transform:scale(1.08)}
}

.send{
  width:55px;
  height:55px;
  border-radius:50%;
  background:#202641;
  font-size:20px;
}

.send:hover{
  background:#303b68;
}

.voiceStatus{
  text-align:center;
  height:25px;
  margin-top:8px;
  color:#8994bb;
  font-size:13px;
}

/* MOBILE */
@media(max-width:600px){
  .core{
    width:190px;
    height:190px;
    top:25%;
  }

  .r1{width:250px;height:250px;top:25%}
  .r2{width:330px;height:330px;top:25%}
  .r3{width:420px;height:420px;top:25%}

  header{
    height:70px;
    padding:0 18px;
  }

  .logo{
    font-size:27px;
  }

  .chat{
    padding:20px 15px 150px;
  }

  .message{
    max-width:90%;
  }

  .controls{
    padding:12px;
  }
}
</style>
</head>

<body>

<div class="background">
  <div class="grid"></div>

  <div class="core"></div>
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="ring r3"></div>
  <div class="scan"></div>

  <div class="dot d1"></div>
  <div class="dot d2"></div>
  <div class="dot d3"></div>
  <div class="dot d4"></div>
  <div class="dot d5"></div>
  <div class="dot d6"></div>
</div>

<div class="app">

<header>
  <div class="logo">Top<span>X</span> AI</div>

  <div class="status">
    <div class="statusDot"></div>
    <span id="status">ONLINE</span>
  </div>
</header>

<main class="chat" id="chat">

  <div class="message ai">
    Hey, I'm TopX. I'm ready to listen.
  </div>

</main>

<div class="controls">

  <div class="inputArea">

    <input
      id="input"
      type="text"
      placeholder="Talk to TopX..."
      autocomplete="off"
    >

    <button
      class="mic"
      id="mic"
      onclick="startListening()"
      aria-label="Talk"
    >🎙️</button>

    <button
      class="send"
      onclick="sendMessage()"
      aria-label="Send"
    >➤</button>

  </div>

  <div class="voiceStatus" id="voiceStatus">
    Tap the microphone to talk
  </div>

</div>

</div>

<script>
const input = document.getElementById("input");
const chat = document.getElementById("chat");
const mic = document.getElementById("mic");
const voiceStatus = document.getElementById("voiceStatus");
const statusText = document.getElementById("status");

/* SPEECH RECOGNITION */
const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;
let listening = false;

if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    listening = true;
    mic.classList.add("listening");
    voiceStatus.textContent = "Listening...";
    statusText.textContent = "LISTENING";
  };

  recognition.onresult = event => {

    const text =
      event.results[0][0].transcript;

    input.value = text;

    listening = false;
    mic.classList.remove("listening");

    voiceStatus.textContent = "Got you — thinking...";

    sendMessage();
  };

  recognition.onerror = event => {

    listening = false;
    mic.classList.remove("listening");

    console.log("Speech error:", event.error);

    if(event.error === "not-allowed"){
      voiceStatus.textContent =
        "Microphone permission is blocked.";
    }else{
      voiceStatus.textContent =
        "I didn't catch that. Try again.";
    }

    statusText.textContent = "ONLINE";
  };

  recognition.onend = () => {

    listening = false;
    mic.classList.remove("listening");

    if(
      voiceStatus.textContent === "Listening..."
    ){
      voiceStatus.textContent =
        "Tap the microphone to talk";
    }

    statusText.textContent = "ONLINE";
  };

}else{

  voiceStatus.textContent =
    "Voice recognition isn't supported in this browser.";
}


/* START LISTENING */
function startListening(){

  if(!recognition){
    alert(
      "Your browser does not support voice recognition."
    );
    return;
  }

  if(listening){
    recognition.stop();
    return;
  }

  try{
    recognition.start();
  }catch(error){
    console.log(error);
  }
}


/* ADD MESSAGE */
function addMessage(text,type){

  const div = document.createElement("div");

  div.className =
    "message " + type;

  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}


/* SEND TO YOUR SERVER */
async function sendMessage(){

  const message =
    input.value.trim();

  if(!message) return;

  addMessage(message,"user");

  input.value = "";

  voiceStatus.textContent =
    "TopX is thinking...";

  statusText.textContent =
    "THINKING";

  try{

    /*
      This sends the message to your existing
      server.js.

      Your server should have:
      POST /api/chat

      and return:
      { "reply": "..." }
    */

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          message:message
        })

      });

    if(!response.ok){
      throw new Error(
        "Server returned " + response.status
      );
    }

    const data =
      await response.json();

    const reply =
      data.reply ||
      data.text ||
      data.response ||
      "I couldn't generate a response.";

    addMessage(reply,"ai");

    statusText.textContent =
      "SPEAKING";

    voiceStatus.textContent =
      "TopX is speaking...";

    speak(reply);

  }catch(error){

    console.error(error);

    const errorMessage =
      "I couldn't connect to my AI server right now.";

    addMessage(errorMessage,"ai");

    voiceStatus.textContent =
      "Connection problem";

    statusText.textContent =
      "OFFLINE";

  }
}


/* AUTOMATIC SPEAKING */
function speak(text){

  if(!("speechSynthesis" in window)){
    voiceStatus.textContent =
      "Your browser doesn't support speech.";
    return;
  }

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "en-US";
  utterance.rate = 0.95;
  utterance.pitch = 0.9;
  utterance.volume = 1;

  utterance.onend = () => {

    statusText.textContent =
      "ONLINE";

    voiceStatus.textContent =
      "Tap the microphone to talk";
  };

  utterance.onerror = () => {

    statusText.textContent =
      "ONLINE";

    voiceStatus.textContent =
      "Tap the microphone to talk";
  };

  window.speechSynthesis.speak(
    utterance
  );
}


/* ENTER KEY */
input.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){
      sendMessage();
    }

  }
);
</script>

</body>
</html>
